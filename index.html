<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minaro Call</title>
<style>
:root{--bg:#fff;--sky:#e8f4fc;--sky2:#cfe8f7;--line:#bfdff2;--accent:#3a9bd5;--accent-d:#2680b8;--text:#1f3a4d;--sub:#6a8799;--danger:#e0585b;--ok:#2fa772}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:var(--text);background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--sky);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;letter-spacing:.02em}
.badge{font-size:13px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.err{color:var(--danger);border-color:var(--danger)}.badge.busy{color:var(--accent-d);border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:52px;padding:0 22px;font-weight:600;background:var(--accent);color:#fff;touch-action:manipulation}
button:hover{background:var(--accent-d)}button:disabled{opacity:.5;cursor:default}
button.sec{background:var(--sky);color:var(--accent-d);border:1px solid var(--line)}button.sec:hover{background:var(--sky2)}
button.off{background:#fff;color:var(--danger);border:2px solid var(--danger)}
button.end{background:var(--danger)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
#lobby{flex:1;display:grid;place-content:center;gap:20px;padding:24px;max-width:460px;width:100%;margin:0 auto}
#lobby h2{margin:0;font-size:24px}#lobby p{margin:0;color:var(--sub)}
.panel{background:var(--sky);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px}
input{font:inherit;font-size:22px;letter-spacing:.2em;text-transform:uppercase;text-align:center;min-height:52px;border:1px solid var(--line);border-radius:14px;padding:0 12px;width:100%;color:var(--text)}
#msg{min-height:1.4em;color:var(--danger);font-size:14px}
#call{flex:1;display:flex;flex-direction:column;min-height:0}
.roombar{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.roombar small{color:var(--sub)}
#roomId{font-size:clamp(28px,8vw,44px);font-weight:700;letter-spacing:.18em;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent-d)}
.roombar button{min-height:44px}
.videos{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;min-height:0}
.tile{position:relative;background:var(--sky);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:200px}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--sky)}
#localV{transform:scaleX(-1)}
.tag{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;font-size:13px}
.controls{display:flex;justify-content:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}
.controls button{flex:1 1 120px;max-width:200px}
@media(max-width:700px){.videos{grid-template-columns:1fr;grid-auto-rows:minmax(160px,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Minaro Call</h1>
    <span id="status" class="badge">準備中</span>
  </header>

  <main id="lobby">
    <div>
      <h2>顔を見て、すぐ話そう</h2>
      <p>ルームを作って、IDを相手に伝えるだけ。</p>
    </div>
    <div class="panel">
      <button id="createBtn" disabled>ルームを作成</button>
    </div>
    <div class="panel">
      <input id="joinInput" maxlength="8" placeholder="ルームID" autocomplete="off" autocapitalize="characters" aria-label="ルームID">
      <button id="joinBtn" class="sec" disabled>ルームに参加</button>
    </div>
    <div id="msg" role="alert"></div>
  </main>

  <section id="call" class="hidden">
    <div class="roombar">
      <small>ルームID</small>
      <span id="roomId" aria-live="polite"></span>
      <button id="copyBtn" class="sec">コピー</button>
    </div>
    <div class="videos">
      <div class="tile"><video id="remoteV" autoplay playsinline></video><span class="tag">相手</span></div>
      <div class="tile"><video id="localV" autoplay playsinline muted></video><span class="tag">自分</span></div>
    </div>
    <div class="controls">
      <button id="micBtn" class="sec">マイク ON</button>
      <button id="camBtn" class="sec">カメラ ON</button>
      <button id="endBtn" class="end">通話終了</button>
    </div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA401EfOfPuflfXhHG96epkEmQvybD9Y5Y",
  authDomain: "minaro-call.firebaseapp.com",
  projectId: "minaro-call",
  storageBucket: "minaro-call.firebasestorage.app",
  messagingSenderId: "983008603694",
  appId: "1:983008603694:web:e1223c82a94c3f06c479bf"
};

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const RTC_CONFIG = { iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }] };

let uid = null, pc = null, localStream = null, roomId = null, role = null;
let unsubs = [], ended = false;

function setStatus(text, kind = "") { const s = $("status"); s.textContent = text; s.className = "badge " + kind; }
function showMsg(t) { $("msg").textContent = t || ""; }

/* ---------- 認証 ---------- */
onAuthStateChanged(auth, user => {
  if (user) { uid = user.uid; $("createBtn").disabled = false; $("joinBtn").disabled = false; setStatus("待機中"); }
});
signInAnonymously(auth).catch(e => { setStatus("エラー", "err"); showMsg("認証に失敗しました: " + e.code); });

/* ---------- ルームID ---------- */
function genRoomId() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 紛らわしい文字を除外
  const r = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(r, n => chars[n % chars.length]).join("");
}

/* ---------- メディア・PC ---------- */
async function startMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: { echoCancellation: true, noiseSuppression: true } });
  $("localV").srcObject = localStream;
}
function createPC() {
  pc = new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  const remote = new MediaStream();
  $("remoteV").srcObject = remote;
  pc.ontrack = e => { e.streams[0].getTracks().forEach(t => remote.addTrack(t)); $("remoteV").play().catch(() => {}); };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === "connected") setStatus("接続済み", "ok");
    else if (s === "connecting" || s === "new") setStatus("接続中…", "busy");
    else if (s === "disconnected") setStatus("切断", "err");
    else if (s === "failed") setStatus("エラー（接続失敗）", "err");
    else if (s === "closed") setStatus("切断", "err");
  };
}
function showCall() {
  $("lobby").classList.add("hidden"); $("call").classList.remove("hidden");
  $("roomId").textContent = roomId;
  $("micBtn").className = "sec"; $("camBtn").className = "sec";
  $("micBtn").textContent = "マイク ON"; $("camBtn").textContent = "カメラ ON";
}
const pending = [];   // remote description 設定前のICE候補
function addRemoteCandidate(c) {
  if (pc.remoteDescription) pc.addIceCandidate(c).catch(() => {}); else pending.push(c);
}
function flushPending() { while (pending.length) pc.addIceCandidate(pending.shift()).catch(() => {}); }
function watchCandidates(sub) {
  unsubs.push(onSnapshot(collection(db, "rooms", roomId, sub), snap => {
    snap.docChanges().forEach(ch => { if (ch.type === "added") addRemoteCandidate(new RTCIceCandidate(ch.doc.data())); });
  }, e => console.warn(sub, e.code)));
}

/* ---------- ルーム作成 (host) ---------- */
$("createBtn").onclick = async () => {
  showMsg(""); $("createBtn").disabled = true;
  try {
    role = "host"; roomId = genRoomId(); ended = false;
    setStatus("接続中…", "busy");
    await startMedia(); createPC();
    let roomReady; const ready = new Promise(r => roomReady = r);
    pc.onicecandidate = async e => {
      if (!e.candidate) return;
      await ready;
      addDoc(collection(db, "rooms", roomId, "hostCandidates"), e.candidate.toJSON()).catch(() => {});
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await setDoc(doc(db, "rooms", roomId), {
      hostUid: uid, guestUid: null, answer: null,
      offer: { type: offer.type, sdp: offer.sdp }, createdAt: serverTimestamp()
    });
    roomReady(); showCall(); setStatus("相手を待っています", "busy");
    unsubs.push(onSnapshot(doc(db, "rooms", roomId), async snap => {
      const d = snap.data();
      if (d && d.answer && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(d.answer)); flushPending();
      }
    }));
    watchCandidates("guestCandidates");
  } catch (e) { fail(e); }
};

/* ---------- ルーム参加 (guest) ---------- */
$("joinBtn").onclick = async () => {
  showMsg("");
  const id = $("joinInput").value.trim().toUpperCase();
  if (id.length !== 8) { showMsg("ルームIDは8文字です。"); return; }
  $("joinBtn").disabled = true;
  try {
    role = "guest"; roomId = id; ended = false;
    setStatus("接続中…", "busy");
    // 先に参加枠を確保する（満員・存在しない場合はルールにより拒否される）
    try { await updateDoc(doc(db, "rooms", id), { guestUid: uid }); }
    catch (e) { roomId = null; throw Object.assign(new Error("join"), { code: "full" }); }
    await startMedia(); createPC();
    pc.onicecandidate = e => {
      if (e.candidate) addDoc(collection(db, "rooms", id, "guestCandidates"), e.candidate.toJSON()).catch(() => {});
    };
    const snap = await getDoc(doc(db, "rooms", id));
    await pc.setRemoteDescription(new RTCSessionDescription(snap.data().offer));
    flushPending();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await updateDoc(doc(db, "rooms", id), { answer: { type: answer.type, sdp: answer.sdp } });
    showCall();
    watchCandidates("hostCandidates");
    // ホストがルームを閉じたら終了
    unsubs.push(onSnapshot(doc(db, "rooms", id), s => { if (!s.exists() && !ended) { hangup(false); setStatus("相手が通話を終了しました", "err"); } }));
  } catch (e) { fail(e); }
};

function fail(e) {
  console.error(e);
  const m = e.code === "full" ? "参加できません。IDが違うか、すでに2人参加しています。"
    : e.name === "NotAllowedError" ? "カメラとマイクの使用を許可してください。"
    : e.name === "NotFoundError" ? "カメラまたはマイクが見つかりません。"
    : "エラーが発生しました: " + (e.code || e.message);
  const room = roomId, r = role;
  cleanup();
  if (r === "host" && room) deleteDoc(doc(db, "rooms", room)).catch(() => {});
  setStatus("エラー", "err"); showMsg(m);
  $("createBtn").disabled = false; $("joinBtn").disabled = false;
}

/* ---------- 操作 ---------- */
function toggle(kind, btn, onText, offText) {
  const tracks = kind === "audio" ? localStream.getAudioTracks() : localStream.getVideoTracks();
  if (!tracks.length) return;
  const on = !tracks[0].enabled; tracks.forEach(t => t.enabled = on);
  btn.textContent = on ? onText : offText; btn.className = on ? "sec" : "off";
}
$("micBtn").onclick = () => toggle("audio", $("micBtn"), "マイク ON", "マイク OFF");
$("camBtn").onclick = () => toggle("video", $("camBtn"), "カメラ ON", "カメラ OFF");
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(roomId); }
  catch { const r = document.createRange(); r.selectNodeContents($("roomId")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
  $("copyBtn").textContent = "コピーしました"; setTimeout(() => $("copyBtn").textContent = "コピー", 1500);
};
$("endBtn").onclick = () => hangup(true);
addEventListener("pagehide", () => { if (roomId && role === "host") deleteDoc(doc(db, "rooms", roomId)).catch(() => {}); });

function cleanup() {
  ended = true;
  unsubs.forEach(u => u()); unsubs = []; pending.length = 0;
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $("localV").srcObject = null; $("remoteV").srcObject = null;
  $("call").classList.add("hidden"); $("lobby").classList.remove("hidden");
  $("createBtn").disabled = false; $("joinBtn").disabled = false;
}
async function hangup(deleteRoom) {
  const room = roomId, r = role;
  cleanup();
  roomId = null; role = null;
  if (deleteRoom && r === "host" && room) await deleteDoc(doc(db, "rooms", room)).catch(() => {});
  setStatus("待機中");
}
</script>
</body>
</html>
